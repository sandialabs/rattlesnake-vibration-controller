<svg width="850" height="420" viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Default: Light Mode Colors */
    .bg { fill: #ffffff; }
    .node-bg { fill: #f6f8fa; stroke: #d0d7de; }
    .text-main { fill: #1f2328; }
    .text-muted { fill: #656d76; }
    .connector { stroke: #d0d7de; }
    
    /* Dark Mode Overrides */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .node-bg { fill: #161b22; stroke: #30363d; }
      .text-main { fill: #e6edf3; }
      .text-muted { fill: #7d8590; }
      .connector { stroke: #484f58; }
    }
  </style>

  <!-- Background -->
  <rect width="850" height="420" class="bg" rx="8"/>
  
  <!-- Header Text -->
  <text x="25" y="45" font-family="sans-serif" font-size="18" font-weight="bold" class="text-main">ci.yml</text>
  <text x="25" y="70" font-family="sans-serif" font-size="14" class="text-muted">on: push</text>

  <!-- Node: Changes -->
  <rect x="25" y="115" width="230" height="44" rx="6" class="node-bg"/>
  <circle cx="45" cy="137" r="9" fill="#3fb950"/>
  <path d="M41 137 l3 3 l5 -6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="65" y="142" font-family="sans-serif" font-size="14" font-weight="bold" class="text-main">changes</text>
  <text x="240" y="142" font-family="sans-serif" font-size="12" class="text-muted" text-anchor="end">12s</text>

  <!-- Node: Matrix Pytest -->
  <rect x="300" y="80" width="260" height="110" rx="6" class="node-bg"/>
  <path d="M300 110 h260" class="connector" fill="none"/>
  <text x="315" y="100" font-family="sans-serif" font-size="12" font-weight="bold" class="text-main">Matrix: pytest_matrix</text>
  <circle cx="330" cy="140" r="8" class="text-muted" stroke-width="1.5" fill="none"/>
  <text x="355" y="145" font-family="sans-serif" font-size="14" font-weight="bold" class="text-main">1 job completed</text>
  <text x="330" y="175" font-family="sans-serif" font-size="12" class="text-muted">Show all jobs</text>

  <!-- Node: Multi-Job Box -->
  <rect x="300" y="230" width="260" height="155" rx="6" class="node-bg"/>
  <circle cx="330" cy="265" r="8" class="text-muted" stroke-width="1.5" fill="none"/>
  <text x="355" y="270" font-family="sans-serif" font-size="14" font-weight="bold" class="text-main">lint</text>
  <text x="545" y="270" font-family="sans-serif" font-size="12" class="text-muted" text-anchor="end">0s</text>
  
  <circle cx="330" cy="310" r="8" class="text-muted" stroke-width="1.5" fill="none"/>
  <text x="355" y="315" font-family="sans-serif" font-size="14" font-weight="bold" class="text-main">coverage</text>
  <text x="545" y="315" font-family="sans-serif" font-size="12" class="text-muted" text-anchor="end">0s</text>
  
  <circle cx="330" cy="355" r="9" fill="#3fb950"/>
  <path d="M326 355 l3 3 l5 -6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="355" y="360" font-family="sans-serif" font-size="14" font-weight="bold" class="text-main">docs_jupyter_book</text>
  <text x="545" y="360" font-family="sans-serif" font-size="12" class="text-muted" text-anchor="end">39s</text>

  <!-- Node: Deploy -->
  <rect x="610" y="115" width="230" height="44" rx="6" class="node-bg"/>
  <circle cx="630" cy="137" r="8" class="text-muted" stroke-width="1.5" fill="none"/>
  <text x="650" y="142" font-family="sans-serif" font-size="14" font-weight="bold" class="text-main">deploy</text>
  <text x="825" y="142" font-family="sans-serif" font-size="12" class="text-muted" text-anchor="end">0s</text>

  <!-- Straightened Connectors -->
  <g class="connector" fill="none" stroke-width="2">
    <!-- From Changes -->
    <path d="M255 137 C 275 137, 280 137, 300 137"/>
    <path d="M255 137 C 280 137, 280 307, 300 307"/>
    
    <!-- To Deploy (Direct Curves) -->
    <path d="M560 137 C 585 137, 590 137, 610 137"/>
    <path d="M560 307 C 585 307, 585 137, 610 137"/>
  </g>
  
  <!-- Joint Dots -->
  <circle cx="255" cy="137" r="3" class="connector" fill="currentColor"/>
  <circle cx="300" cy="137" r="3" class="connector" fill="currentColor"/>
  <circle cx="300" cy="307" r="4" fill="#1f6feb"/> 
  <circle cx="560" cy="137" r="3" class="connector" fill="currentColor"/>
  <circle cx="560" cy="307" r="3" class="connector" fill="currentColor"/>
  <circle cx="610" cy="137" r="3" class="connector" fill="currentColor"/>
</svg>

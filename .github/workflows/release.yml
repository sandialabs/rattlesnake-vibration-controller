name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger only on version tags (e.g., v1.0.0)

# Concurrency assures that if one pushes to a build that is already running, the old one is cancelled to save time and resources.
concurrency:
  group: release-pipeline # All runs of this workflow will be in the same concurrency group, so if a new run is triggered while another is still running, the old one will be cancelled.
  cancel-in-progress: true

env:
  # Force all JavaScript actions to run on Node 24 (The 2026 Standard)
  # After 02 June 2026, the following line can be removed since on that date,
  # Node.js 24 will be the GitHub default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # GitHub will swtich on 02 June 2026 to Node.js 24 as the default for JavaScript actions, but until then, this ensures all actions use Node.js 24 to avoid any issues with older versions. After 02 June 2026, this line can be safely removed.

jobs:
  # 1. VALIDATE: Ensure the tag was created on main or dev
  validate_tag:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on main or dev branch
        run: |
          TAG="${{ github.ref_name }}"
          BRANCHES=$(git branch -r --contains "refs/tags/$TAG" | grep -E '^\s*origin/(main|dev)\s*$' || true)
          if [ -z "$BRANCHES" ]; then
            echo "ERROR: Tag '$TAG' must be created on the 'main' or 'dev' branch."
            echo "Tag is reachable from:"
            git branch -r --contains "refs/tags/$TAG" || echo "  (no remote branches)"
            exit 1
          fi
          echo "OK: Tag '$TAG' is on:$BRANCHES"

      - name: Verify tag conforms to PEP 440
        run: |
          pip install packaging --quiet
          python - <<'EOF'
          import sys
          from packaging.version import Version, InvalidVersion
          tag = "${{ github.ref_name }}"
          version_str = tag.lstrip("v")
          try:
              Version(version_str)
              print(f"OK: '{tag}' is a valid PEP 440 version.")
          except InvalidVersion:
              print(f"ERROR: '{tag}' is not a valid PEP 440 version.")
              print( "       Valid examples: v1.0.0  v1.1.0a1  v1.1.0rc1  v1.0.0.post1  v1.1.0.dev1")
              sys.exit(1)
          EOF

      - name: Verify tag is newer than all existing tags
        run: |
          python - <<'EOF'
          import sys
          import subprocess
          from packaging.version import Version, InvalidVersion
          new_tag = "${{ github.ref_name }}"
          new_version = Version(new_tag.lstrip("v"))

          result = subprocess.run(
              ["git", "tag"],
              capture_output=True, text=True
          )
          existing_versions = []
          for tag in result.stdout.strip().splitlines():
              tag = tag.strip()
              if tag == new_tag:
                  continue  # exclude the tag being validated
              try:
                  existing_versions.append((Version(tag.lstrip("v")), tag))
              except InvalidVersion:
                  pass  # skip tags that don't conform to PEP 440

          if not existing_versions:
              print(f"OK: No existing tags to compare against. '{new_tag}' is the first release.")
              sys.exit(0)

          latest_version, latest_tag = max(existing_versions, key=lambda x: x[0])
          if new_version <= latest_version:
              print(f"ERROR: '{new_tag}' ({new_version}) is not newer than the existing tag '{latest_tag}' ({latest_version}).")
              print(f"       The new tag must be strictly greater than {latest_version}.")
              sys.exit(1)

          print(f"OK: '{new_tag}' ({new_version}) is newer than the latest existing tag '{latest_tag}' ({latest_version}).")
          EOF

      - name: Determine prerelease status
        # Version.is_prerelease is the single source of truth for whether this
        # tag is a prerelease (a/b/rc/.dev segments) or a stable/.post release.
        # github-release and the publish_testpypi/publish_pypi jobs below all
        # read this one output instead of re-deriving it with their own
        # substring checks, so the two can never disagree.
        id: prerelease_check
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          from packaging.version import Version
          tag = "${{ github.ref_name }}"
          version = Version(tag.lstrip("v"))
          print(f"is_prerelease={'true' if version.is_prerelease else 'false'}")
          EOF

  # 2. TEST JOB: Runs Pytest
  test:
    needs: validate_tag
    uses: ./.github/workflows/ci.yml

  # 3. BUILD: Only runs if 'test' passes
  build:
    name: Build Distribution and Generate Attestation
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for attestation/provenance generation and signing
      attestations: write # Required for attestation/provenance generation and signing
      contents: read # Needed to read the repository contents for versioning and building
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for versioning tools to see tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1 # Generate a SLSA provenance attestation for the build artifacts, which can be used to verify the integrity and origin of the build outputs.
        with:
          subject-path: 'dist/*' # Specify the path to the build artifacts to include in the attestation

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # 4. GITHUB RELEASE: Creates the release on GitHub and attaches the build files
  github-release:
    needs: [build, validate_tag] # validate_tag is already an ancestor via build -> test -> validate_tag; listed explicitly to access its is_prerelease output
    if: startsWith(github.ref, 'refs/tags/') # Only release on actual tags, redundant to on: push: tags: - 'v*', but safeguards against any other trigger that might be added later.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and upload assets
      # id-token: write # Required for attestation/provenance generation and signing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true # Automatically generate release notes based on commits since the last release
          draft: false # Set to true if you want to create a draft release instead of publishing immediately
          prerelease: ${{ needs.validate_tag.outputs.is_prerelease == 'true' }} # Single source of truth, computed once in validate_tag

  # 5a. PUBLISH (PRERELEASE): Only runs if 'build' passes and the tag is a prerelease
  publish_testpypi:
    name: "Publish: TestPyPI (prerelease)"
    needs: [build, github-release, validate_tag] # validate_tag is already an ancestor; listed explicitly to access its is_prerelease output
    if: needs.validate_tag.outputs.is_prerelease == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    # No approval gate configured on 'testpypi' — prereleases are low-risk by design.
    permissions:
      id-token: write # Needed for authentication with TestPyPI using GitHub Actions
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Trusted Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password needed with Trusted Publishing configured on TestPyPI.
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Write summary
        run: |
          {
            echo "🧪 Published \`${{ github.ref_name }}\` to **TestPyPI** (prerelease)"
            echo
            echo "https://test.pypi.org/project/rattlesnake-vibration-controller/"
          } >> "$GITHUB_STEP_SUMMARY"

  # 5b. PUBLISH (RELEASE): Only runs if 'build' passes and the tag is a stable/post release
  publish_pypi:
    name: "Publish: PyPI (production release)"
    needs: [build, github-release, validate_tag] # validate_tag is already an ancestor; listed explicitly to access its is_prerelease output
    if: needs.validate_tag.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    # Manual approval gate is configured on the 'pypi' GitHub environment (Settings → Environments → pypi → Required reviewers)
    permissions:
      id-token: write # Needed for authentication with PyPI using GitHub Actions
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Trusted Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password needed with Trusted Publishing configured on PyPI.
        # No repository-url: the action defaults to production PyPI.

      - name: Write summary
        run: |
          {
            echo "📦 Published \`${{ github.ref_name }}\` to **production PyPI**"
            echo
            echo "https://pypi.org/project/rattlesnake-vibration-controller/"
          } >> "$GITHUB_STEP_SUMMARY"

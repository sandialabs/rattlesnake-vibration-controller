name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger only on version tags (e.g., v1.0.0)

# Concurrency assures that if one pushes to a build that is already running, the old one is cancelled to save time and resources.
concurrency:
  group: release-pipeline # All runs of this workflow will be in the same concurrency group, so if a new run is triggered while another is still running, the old one will be cancelled.
  cancel-in-progress: true

env:
  # Force all JavaScript actions to run on Node 24 (The 2026 Standard)
  # After 02 June 2026, the following line can be removed since on that date,
  # Node.js 24 will be the GitHub default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # GitHub will swtich on 02 June 2026 to Node.js 24 as the default for JavaScript actions, but until then, this ensures all actions use Node.js 24 to avoid any issues with older versions. After 02 June 2026, this line can be safely removed.

jobs:
  # 1. VALIDATE: Ensure the tag was created on main or dev
  validate_tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on main or dev branch
        run: |
          TAG="${{ github.ref_name }}"
          BRANCHES=$(git branch -r --contains "refs/tags/$TAG" | grep -E '^\s*origin/(main|dev)\s*$' || true)
          if [ -z "$BRANCHES" ]; then
            echo "ERROR: Tag '$TAG' must be created on the 'main' or 'dev' branch."
            echo "Tag is reachable from:"
            git branch -r --contains "refs/tags/$TAG" || echo "  (no remote branches)"
            exit 1
          fi
          echo "OK: Tag '$TAG' is on:$BRANCHES"

      - name: Verify tag conforms to PEP 440
        run: |
          pip install packaging --quiet
          python - <<'EOF'
          import sys
          from packaging.version import Version, InvalidVersion
          tag = "${{ github.ref_name }}"
          version_str = tag.lstrip("v")
          try:
              Version(version_str)
              print(f"OK: '{tag}' is a valid PEP 440 version.")
          except InvalidVersion:
              print(f"ERROR: '{tag}' is not a valid PEP 440 version.")
              print( "       Valid examples: v1.0.0  v1.1.0a1  v1.1.0rc1  v1.0.0.post1  v1.1.0.dev1")
              sys.exit(1)
          EOF

  # 2. TEST JOB: Runs Pytest
  test:
    needs: validate_tag
    uses: ./.github/workflows/ci.yml

  # 2. BUILD: Only runs if 'test' passes
  build:
    name: Build Distribution and Generate Attestation
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for attestation/provenance generation and signing
      attestations: write # Required for attestation/provenance generation and signing
      contents: read # Needed to read the repository contents for versioning and building
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for versioning tools to see tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1 # Generate a SLSA provenance attestation for the build artifacts, which can be used to verify the integrity and origin of the build outputs.
        with:
          subject-path: 'dist/*' # Specify the path to the build artifacts to include in the attestation

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # 3. GITHUB RELEASE: Creates the release on GitHub and attaches the build files
  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') # Only release on actual tags, redundant to on: push: tags: - 'v*', but safeguards against any other trigger that might be added later.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and upload assets
      # id-token: write # Required for attestation/provenance generation and signing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true # Automatically generate release notes based on commits since the last release
          draft: false # Set to true if you want to create a draft release instead of publishing immediately
          prerelease: false # Set to true if this is a pre-release (e.g., alpha, beta)

  # 4. PUBLISH: Only runs if 'build' passes
  publish-to-pypi-or-testpypi:
    name: Publish to PyPI or TestPyPI
    needs: [build, github-release] # Ensure both build and GitHub release steps succeed before publishing
    runs-on: ubuntu-latest
    # environment: pypi
    # Set the environment based on the tag name
    environment: ${{ (contains(github.ref, 'rc') || contains(github.ref, 'dev')) && 'testpypi' || 'pypi' }} # If the tag contains 'rc' or 'dev', use the 'testpypi' environment, otherwise use 'pypi'
    # Optional: Use environment protection rule for manual approval before publishing
    permissions:
      id-token: write # Needed for authentication with PyPI using GitHub Actions
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Trusted Publish to TestPyPI or PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password needed with Trusted Publishing configured on PyPI.
        with:
          # If the tag contains '-test', use the TestPyPI URL; otherwise, use the default PyPI URL
          repository-url: ${{ (contains(github.ref, 'rc') || contains(github.ref, 'dev')) && 'https://test.pypi.org/legacy/' || '' }}  # Production PyPI uses the default URL, so the empty string will cause it to default to the standard PyPI repository. TestPyPI will use the specified URL. 
